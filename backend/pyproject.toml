[project]
name = "agent-platform"
version = "0.1.0"
description = "Enterprise AI Agent Platform demo: RAG + OCR, tool calling, MCP, skill library, experience memory, RBAC, audit, cost control"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "anthropic>=1.0",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pymupdf>=1.24",
  "pytesseract>=0.3.10",
  "pillow>=10.0",
  "numpy>=1.26",  # app/ocr/preprocess.py (trước đây chỉ có gián tiếp qua pgvector/fastembed)
  "python-docx>=1.1",
  "fastembed>=0.4",
  "mcp>=1.2",
]

[project.optional-dependencies]
# Cài thêm khi cần: pip install -e ".[audio,browser]"
audio = ["faster-whisper>=1.0"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() trong default argument là pattern chuẩn
