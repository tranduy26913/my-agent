<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio style options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= Comparison chrome (not part of any version) ================= */
:root { --c-bg:#e9eaee; --c-fg:#16181d; --c-muted:#5d6370; --c-line:#d5d8df; --c-card:#ffffff; }
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:var(--c-bg); color:var(--c-fg); font-family:Inter, system-ui, sans-serif; }
* { scrollbar-width:thin; scrollbar-color:rgb(0 0 0 / .2) transparent; }
.bar { position:sticky; top:0; z-index:10; background:rgb(233 234 238 / .92); backdrop-filter:blur(12px); border-bottom:1px solid var(--c-line); }
.bar-in { max-width:1180px; margin:0 auto; padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.bar h1 { font-size:14px; font-weight:600; margin:0 12px 0 0; }
.tab { font:inherit; font-size:13px; font-weight:500; height:34px; padding:0 14px; border-radius:8px; border:1px solid var(--c-line); background:var(--c-card); color:var(--c-fg); cursor:pointer; }
.tab[aria-selected="true"] { background:var(--c-fg); color:#fff; border-color:var(--c-fg); }
.tab .rec { font-size:11px; opacity:.7; margin-left:4px; }
.view { margin-left:auto; display:flex; gap:4px; }
.depth { display:flex; align-items:center; gap:4px; margin-left:12px; padding-left:12px; border-left:1px solid var(--c-line); font-size:13px; color:var(--c-muted); }
.depth[hidden] { display:none; }
@media (max-width:860px){ .depth { margin-left:0; padding-left:0; border-left:0; } }
.info { max-width:1180px; margin:16px auto 0; padding:0 16px; }
.info-card { background:var(--c-card); border:1px solid var(--c-line); border-radius:12px; padding:16px 20px; display:grid; grid-template-columns:1.1fr 1fr 1fr 1fr; gap:20px; }
.info-card h2 { font-size:17px; margin:0 0 4px; }
.info-card p { margin:0; font-size:13.5px; line-height:1.55; color:var(--c-muted); }
.info-card b { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--c-fg); margin-bottom:4px; }
.stage { max-width:1180px; margin:16px auto 48px; padding:0 16px; }
.frame { margin:0 auto; border-radius:16px; overflow:hidden; box-shadow:0 1px 2px rgb(0 0 0 / .06), 0 20px 50px -20px rgb(0 0 0 / .25); transition:max-width .3s; }
.frame.phone { max-width:390px; }
@media (max-width:860px){ .info-card { grid-template-columns:1fr; gap:12px; } .view{ margin-left:0; } }

/* ================= Shared structure ================= */
.site { background:var(--bg); color:var(--fg); font-family:var(--font); }
.site a { color:inherit; text-decoration:none; }
.nav { display:flex; align-items:center; gap:16px; height:64px; padding:0 32px; }
.logo { font-weight:700; letter-spacing:.04em; font-size:14px; }
.nav nav { margin-left:auto; display:flex; gap:2px; font-size:14px; color:var(--muted); }
.nav nav a { padding:6px 10px; border-radius:8px; }
.theme { width:36px; height:36px; display:grid; place-items:center; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
.theme svg, .soc svg, .btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.body { max-width:1100px; margin:0 auto; padding:0 32px 56px; }
.hero { display:grid; grid-template-columns:1fr auto; gap:48px; align-items:center; padding:56px 0 40px; }
.eyebrow { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:0; }
.hero h1 { font-size:clamp(34px, 5vw, 56px); line-height:1.08; letter-spacing:-.03em; font-weight:650; margin:16px 0 0; }
.lead { font-size:18px; line-height:1.6; color:var(--muted); max-width:36rem; margin:20px 0 0; }
.ctas { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:28px; }
.btn { height:44px; padding:0 20px; display:inline-flex; align-items:center; gap:8px; border-radius:999px; font-size:14px; font-weight:600; }
.socials { display:flex; gap:2px; color:var(--muted); }
.soc { width:40px; height:40px; display:grid; place-items:center; border-radius:999px; }
.avatar { width:272px; height:272px; position:relative; }
.avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; position:relative; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.stat { padding:20px 22px; }
.stat .v { display:block; font-size:30px; font-weight:700; letter-spacing:-.02em; }
.stat .l { display:block; font-size:14px; line-height:1.45; color:var(--muted); margin-top:4px; }
.agent { margin-top:40px; padding:28px; }
.agent-head { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.kicker { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
.agent h2 { font-size:26px; letter-spacing:-.02em; margin:10px 0 0; width:100%; }
.status { font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; }
.agent > p { font-size:16px; line-height:1.65; color:var(--muted); max-width:46rem; margin:12px 0 0; }
.hl { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; list-style:none; padding:0; margin:24px 0; counter-reset:hl; }
.hl li { padding:16px 18px; counter-increment:hl; }
.hl strong { display:block; font-size:15px; font-weight:600; }
.hl span { display:block; font-size:14px; line-height:1.5; color:var(--muted); margin-top:4px; }
.stack { display:flex; flex-wrap:wrap; gap:8px; }
.chip { font-size:13px; padding:5px 11px; border-radius:999px; }

/* Phone frame (and real narrow screens) */
.frame.phone .nav nav, .frame.phone .nav-links-hide { display:none; }
.frame.phone .nav, .frame.phone .body { padding-left:16px; padding-right:16px; }
.frame.phone .nav .theme { margin-left:auto; }
.frame.phone .hero { grid-template-columns:1fr; gap:24px; padding-top:28px; }
.frame.phone .avatar { order:-1; width:148px; height:148px; }
.frame.phone .stats, .frame.phone .hl { grid-template-columns:1fr; }
.frame.phone .agent { padding:20px; }
@media (max-width:760px){
  .nav nav { display:none; } .nav .theme { margin-left:auto; }
  .nav, .body { padding-left:16px; padding-right:16px; }
  .hero { grid-template-columns:1fr; gap:24px; padding-top:28px; }
  .avatar { order:-1; width:148px; height:148px; }
  .stats, .hl { grid-template-columns:1fr; }
  .agent { padding:20px; }
}

/* ================= 0. Current (monochrome) ================= */
.v-now { --font:'Geist', system-ui, sans-serif; --bg:#fff; --fg:#171717; --muted:#5c5c5c; --line:#e5e5e5; }
.v-now .nav { border-bottom:1px solid rgb(0 0 0 / .05); }
.v-now .logo { font-family:'Geist Mono', monospace; }
.v-now .eyebrow { font-family:'Geist Mono', monospace; }
.v-now .btn-p { background:#171717; color:#fff; }
.v-now .btn-s, .v-now .stat, .v-now .agent { background:#f4f4f4; border:1px solid rgb(255 255 255 / .6); box-shadow:inset 0 1px 0 rgb(255 255 255 / .8), 0 1px 2px rgb(16 24 40 / .04), 0 10px 30px -10px rgb(16 24 40 / .14); }
.v-now .stat, .v-now .agent { border-radius:16px; }
.v-now .stat .v { text-shadow:0 0 24px rgb(163 163 163 / .55); }
.v-now .avatar::before { content:""; position:absolute; inset:-6px; border-radius:50%; background:#fff; box-shadow:0 0 60px 10px rgb(163 163 163 / .55); }
.v-now .avatar img { border:4px solid #fff; }
.v-now .kicker { color:#404040; }
.v-now .status { background:#ebebeb; }
.v-now .hl li { background:#fff; border-radius:12px; box-shadow:0 1px 2px rgb(16 24 40 / .06); }
.v-now .chip { background:#fff; box-shadow:0 1px 2px rgb(16 24 40 / .06); }

/* ================= A. Indigo Clean ================= */
.v-a { --font:'Geist', system-ui, sans-serif; --bg:#f7f8fb; --fg:#111827; --muted:#5b6475; --line:#e4e7ee; --accent:#4f46e5; --accent-soft:#eef0ff; }
.v-a .nav { background:rgb(255 255 255 / .8); border-bottom:1px solid var(--line); }
.v-a .logo .dot { color:var(--accent); }
.v-a .nav nav a:first-child { color:var(--fg); background:var(--accent-soft); }
.v-a .theme { background:#fff; }
.v-a .eyebrow { color:var(--accent); font-weight:600; letter-spacing:.14em; }
.v-a .role { color:var(--accent); }
.v-a .btn-p { background:var(--accent); color:#fff; box-shadow:0 1px 2px rgb(79 70 229 / .3), 0 8px 20px -8px rgb(79 70 229 / .55); }
.v-a .btn-s { background:#fff; border:1px solid var(--line); }
.v-a .soc { background:#fff; border:1px solid var(--line); margin-right:6px; }
.v-a .avatar::before { content:""; position:absolute; inset:-14px; border-radius:50%; background:var(--accent-soft); }
.v-a .avatar::after { content:""; position:absolute; inset:-14px; border-radius:50%; border:1px dashed rgb(79 70 229 / .35); }
.v-a .avatar img { border:6px solid #fff; box-shadow:0 12px 32px -12px rgb(17 24 39 / .35); z-index:1; }
.v-a .stat, .v-a .agent { background:#fff; border:1px solid var(--line); border-radius:16px; }
.v-a .stat .v { color:var(--accent); }
.v-a .kicker { color:var(--accent); background:var(--accent-soft); padding:4px 10px; border-radius:999px; }
.v-a .status { background:#fef3c7; color:#92400e; }
.v-a .hl li { background:var(--bg); border-radius:12px; border:1px solid transparent; }
.v-a .hl strong::before { content:""; display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--accent); margin-right:8px; vertical-align:1px; }
.v-a .chip { background:#fff; border:1px solid var(--line); color:#374151; }

/* A — depth levels (ui-ux P7): pure shadow, NO border and NO 1px ring.
   The tight first layer draws the edge, the wide soft layer lifts the block. Hover = one step up, no scale. */
.v-a.d1, .v-a.d2, .v-a.d3 { --sh-key:rgb(17 24 39 / .08); }
.v-a.d1 {
  --sh-card:0 1px 2px var(--sh-key), 0 4px 14px -4px rgb(17 24 39 / .10);
  --sh-hover:0 2px 4px var(--sh-key), 0 12px 28px -8px rgb(17 24 39 / .16);
  --sh-chip:0 1px 2px rgb(17 24 39 / .08), 0 1px 4px rgb(17 24 39 / .04); }
.v-a.d2 {
  --sh-card:0 1px 2px var(--sh-key), 0 4px 8px -2px rgb(17 24 39 / .06), 0 14px 32px -8px rgb(17 24 39 / .16);
  --sh-hover:0 2px 4px var(--sh-key), 0 8px 16px -4px rgb(17 24 39 / .08), 0 24px 48px -12px rgb(17 24 39 / .24);
  --sh-chip:0 1px 2px rgb(17 24 39 / .08), 0 3px 8px -2px rgb(17 24 39 / .08); }
.v-a.d3 { --sh-key:rgb(17 24 39 / .10);
  --sh-card:0 2px 4px var(--sh-key), 0 8px 16px -4px rgb(17 24 39 / .08), 0 28px 56px -14px rgb(17 24 39 / .28);
  --sh-hover:0 3px 6px var(--sh-key), 0 12px 24px -6px rgb(17 24 39 / .10), 0 36px 72px -16px rgb(17 24 39 / .34);
  --sh-chip:0 1px 3px rgb(17 24 39 / .10), 0 6px 14px -4px rgb(17 24 39 / .12); }
.v-a.d1 .stat, .v-a.d1 .agent, .v-a.d2 .stat, .v-a.d2 .agent, .v-a.d3 .stat, .v-a.d3 .agent {
  border:0; box-shadow:var(--sh-card); transition:box-shadow .2s ease; }
.v-a.d1 .stat:hover, .v-a.d1 .agent:hover, .v-a.d2 .stat:hover, .v-a.d2 .agent:hover, .v-a.d3 .stat:hover, .v-a.d3 .agent:hover {
  box-shadow:var(--sh-hover); }
/* Inner highlight tiles: white, raised one step lower than the card. */
.v-a.d2 .hl li, .v-a.d3 .hl li { background:#fff; border:0; box-shadow:var(--sh-chip); }
.v-a.d1 .chip, .v-a.d2 .chip, .v-a.d3 .chip, .v-a.d1 .btn-s, .v-a.d2 .btn-s, .v-a.d3 .btn-s, .v-a.d1 .soc, .v-a.d2 .soc, .v-a.d3 .soc, .v-a.d1 .theme, .v-a.d2 .theme, .v-a.d3 .theme {
  border:0; box-shadow:var(--sh-chip); }
.v-a.d2 .avatar img, .v-a.d3 .avatar img { box-shadow:0 2px 4px rgb(17 24 39 / .08), 0 24px 48px -14px rgb(17 24 39 / .40); }

/* ================= B. Midnight Terminal ================= */
.v-b { --font:'Geist', system-ui, sans-serif; --mono:'JetBrains Mono', monospace; --bg:#0a0e17; --fg:#e6e9f2; --muted:#8b93a7; --line:#1f2738; --surface:#0f1522; --accent:#34d399; --accent-2:#22d3ee; }
.v-b { background:radial-gradient(900px 420px at 85% -10%, rgb(52 211 153 / .14), transparent 60%), radial-gradient(700px 380px at -10% 20%, rgb(34 211 238 / .08), transparent 60%), var(--bg); }
.v-b .nav { border-bottom:1px solid var(--line); }
.v-b .logo { font-family:var(--mono); }
.v-b .logo .dot { color:var(--accent); }
.v-b .nav nav a { font-family:var(--mono); font-size:13px; }
.v-b .nav nav a:first-child { color:var(--accent); }
.v-b .eyebrow { font-family:var(--mono); text-transform:none; letter-spacing:0; font-size:13px; }
.v-b .eyebrow::before { content:"~/ "; color:var(--accent); }
.v-b .role { background:linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.v-b .btn-p { background:var(--accent); color:#04130d; border-radius:10px; box-shadow:0 0 0 1px rgb(52 211 153 / .4), 0 10px 30px -10px rgb(52 211 153 / .6); }
.v-b .btn-s { border:1px solid var(--line); background:var(--surface); border-radius:10px; }
.v-b .soc:hover { color:var(--accent); }
.v-b .avatar::before { content:""; position:absolute; inset:-3px; border-radius:50%; background:conic-gradient(from 200deg, var(--accent), var(--accent-2), transparent 60%, var(--accent)); }
.v-b .avatar img { border:6px solid var(--bg); }
.v-b .stat, .v-b .agent { background:rgb(15 21 34 / .8); border:1px solid var(--line); border-radius:14px; }
.v-b .stat .v { font-family:var(--mono); color:var(--accent); font-size:28px; }
.v-b .stat:nth-child(2) .v { color:var(--accent-2); }
.v-b .stat:nth-child(3) .v { color:#c4b5fd; }
.v-b .agent { padding:0; overflow:hidden; }
.v-b .agent-head { padding:12px 18px; border-bottom:1px solid var(--line); background:#0c111c; font-family:var(--mono); font-size:13px; }
.v-b .agent-head::before { content:""; width:52px; height:12px; background:radial-gradient(circle 6px at 6px 6px, #f87171 98%, transparent), radial-gradient(circle 6px at 26px 6px, #fbbf24 98%, transparent), radial-gradient(circle 6px at 46px 6px, #34d399 98%, transparent); }
.v-b .kicker { font-family:var(--mono); color:var(--muted); text-transform:none; letter-spacing:0; font-weight:400; }
.v-b .kicker::before { content:"agents/"; color:var(--accent); }
.v-b .agent h2 { display:none; }
.v-b .status { margin-left:auto; color:var(--accent); background:rgb(52 211 153 / .1); font-family:var(--mono); font-weight:500; }
.v-b .status::before { content:"● "; }
.v-b .agent > .t { display:block; font-size:26px; font-weight:650; letter-spacing:-.02em; margin:24px 28px 0; }
.v-b .agent > p { margin:10px 28px 0; }
.v-b .hl { margin:24px 28px; }
.v-b .stack { margin:0 28px 28px; }
.v-b .hl li { background:#0c111c; border:1px solid var(--line); border-radius:10px; }
.v-b .hl strong::before { content:counter(hl, decimal-leading-zero) "  "; font-family:var(--mono); color:var(--accent); font-size:13px; }
.v-b .chip { font-family:var(--mono); font-size:12px; border:1px solid var(--line); color:#b6bdcc; border-radius:6px; }
.v-b .theme { border-color:var(--line); }
.frame.phone .v-b .agent { padding:0; }
.frame.phone .v-b .agent > .t, .frame.phone .v-b .agent > p, .frame.phone .v-b .hl, .frame.phone .v-b .stack { margin-left:18px; margin-right:18px; }

/* ================= C. Editorial Paper ================= */
.v-c { --font:'Inter', system-ui, sans-serif; --serif:'Fraunces', Georgia, serif; --bg:#f6f1e9; --fg:#1f1a14; --muted:#6b6157; --line:#ddd3c4; --accent:#c2410c; }
.v-c .nav { border-bottom:1px solid var(--line); }
.v-c .logo { font-family:var(--serif); font-size:20px; font-weight:600; letter-spacing:0; }
.v-c .logo .dot { color:var(--accent); }
.v-c .nav nav a:first-child { color:var(--fg); text-decoration:underline; text-underline-offset:6px; text-decoration-color:var(--accent); }
.v-c .theme { border-color:var(--line); }
.v-c .hero { padding:64px 0 48px; border-bottom:1px solid var(--line); }
.v-c .eyebrow { letter-spacing:.2em; }
.v-c .hero h1 { font-family:var(--serif); font-weight:400; font-size:clamp(38px, 6vw, 68px); letter-spacing:-.025em; line-height:1.02; }
.v-c .role { font-style:italic; color:var(--accent); }
.v-c .lead { font-size:19px; }
.v-c .btn { border-radius:6px; }
.v-c .btn-p { background:var(--fg); color:var(--bg); }
.v-c .btn-s { border:1px solid var(--fg); }
.v-c .btn-s::after { content:"→"; }
.v-c .avatar { width:250px; height:310px; }
.v-c .avatar img { border-radius:160px 160px 14px 14px; filter:saturate(.85) contrast(1.02); }
.v-c .avatar::after { content:""; position:absolute; inset:14px -14px -14px 14px; border:1px solid var(--accent); border-radius:160px 160px 14px 14px; z-index:-1; }
.v-c .avatar { z-index:0; isolation:isolate; }
.v-c .stats { gap:0; border-bottom:1px solid var(--line); }
.v-c .stat { padding:28px 24px 28px 0; }
.v-c .stat + .stat { border-left:1px solid var(--line); padding-left:24px; }
.v-c .stat .v { font-family:var(--serif); font-weight:400; font-size:44px; letter-spacing:-.02em; }
.v-c .stat:first-child .v { color:var(--accent); }
.v-c .agent { padding:40px 0 0; }
.v-c .kicker { color:var(--accent); letter-spacing:.2em; }
.v-c .kicker::before { content:"01 — "; color:var(--muted); }
.v-c .status { border:1px solid var(--line); color:var(--muted); font-weight:500; }
.v-c .agent h2 { font-family:var(--serif); font-weight:400; font-size:40px; letter-spacing:-.02em; }
.v-c .agent > p { font-size:17px; }
.v-c .hl { gap:0 32px; }
.v-c .hl li { padding:18px 0; border-top:1px solid var(--line); }
.v-c .hl strong { font-family:var(--serif); font-weight:500; font-size:19px; }
.v-c .hl strong::before { content:counter(hl) ". "; color:var(--accent); font-style:italic; }
.v-c .chip { border:1px solid var(--line); border-radius:4px; color:var(--muted); }
.frame.phone .v-c .avatar { width:150px; height:186px; }
.frame.phone .v-c .stat + .stat { border-left:0; border-top:1px solid var(--line); padding-left:0; }
.frame.phone .v-c .stat { padding:20px 0; }
.frame.phone .v-c .agent { padding:32px 0 0; }
.frame.phone .v-c .hero h1 { font-size:40px; }
@media (max-width:760px){ .v-c .avatar { width:150px; height:186px; } .v-c .stat + .stat { border-left:0; border-top:1px solid var(--line); padding-left:0; } .v-c .agent{padding:32px 0 0;} }

/* ================= D. Bento Vivid ================= */
.v-d { --font:'Plus Jakarta Sans', system-ui, sans-serif; --bg:#f4f3fb; --fg:#15132b; --muted:#5f5b7a; --line:#e4e1f3; --accent:#6d28d9; }
.v-d .nav { max-width:1100px; margin:0 auto; padding-top:16px; height:80px; }
.v-d .nav nav { background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px; margin-right:8px; }
.v-d .nav nav a { border-radius:999px; }
.v-d .nav nav a:first-child { background:var(--fg); color:#fff; }
.v-d .logo { font-weight:800; font-size:18px; }
.v-d .logo .dot { color:var(--accent); }
.v-d .theme { background:#fff; border-color:var(--line); }
.v-d .body { display:grid; grid-template-columns:repeat(6, 1fr); gap:14px; padding-top:8px; }
.v-d .hero, .v-d .stats { display:contents; }
.v-d .hero-text { grid-column:span 4; background:#fff; border:1px solid var(--line); border-radius:28px; padding:40px; position:relative; overflow:hidden; }
.v-d .hero-text::before { content:""; position:absolute; width:360px; height:360px; right:-120px; top:-140px; border-radius:50%; background:radial-gradient(circle, rgb(167 139 250 / .45), rgb(244 114 182 / .25) 45%, transparent 70%); filter:blur(10px); }
.v-d .hero-text > * { position:relative; }
.v-d .eyebrow { display:inline-block; background:#f1ecff; color:var(--accent); padding:6px 12px; border-radius:999px; letter-spacing:.08em; font-weight:700; font-size:11px; }

.v-d .btn-s { background:#f1ecff; color:var(--accent); }

.v-d .stat:nth-child(3) { background:#15132b; color:#fff; }

.v-d .stat:nth-child(3) .l { color:#b9b5d6; }

.v-d .kicker { color:var(--accent); }
.v-d .status { background:#dcfce7; color:#166534; }
.v-d .agent h2 { font-size:30px; font-weight:800; letter-spacing:-.03em; }

  </main></div>`;
}

const INFO = {
  now: ["Bản hiện tại (monochrome)", "Trắng, xám, đen; card xám có bóng và glow xám.", "Gọn, an toàn.", "Không có điểm nhấn nào kéo mắt: số 35–50% và phần AI chìm giữa các khối xám giống nhau. Glow xám trông mờ bẩn hơn là sang."],
  a: ["A · Indigo Clean", "Nền xám rất nhạt, card trắng, một màu nhấn indigo. Độ nổi: Phẳng = viền mảnh; Nhẹ / Vừa / Rõ = không viền, card nổi hoàn toàn bằng shadow nhiều lớp, rê chuột thì bóng tăng một bậc.", "Vừa (khuyên): card nổi rõ bằng 3 lớp bóng, ô điểm nổi bật trong card AI, chip và nút phụ cũng nổi nhẹ; không có đường viền nào.", "Rõ: khối rất nổi, bóng sâu và dài, nhưng nhiều card cạnh nhau dễ nặng. Phẳng: sạch nhất nhưng như bạn thấy, hơi dẹt."],
  b: ["B · Midnight Terminal", "Nền tối navy, nhấn xanh ngọc + cyan, chữ mono cho nhãn, card dự án AI có thanh cửa sổ terminal.", "Đúng chất AI / dev tool, nhìn là biết người làm agent, MCP. Ấn tượng mạnh với interviewer kỹ thuật.", "Dark làm mặc định: đọc đoạn dài mỏi hơn, HR không kỹ thuật có thể thấy 'nặng'. Cần làm kỹ bản sáng nếu giữ nút đổi theme."],
  c: ["C · Editorial Paper", "Giấy kem ấm, chữ serif Fraunces cho tiêu đề, nhấn cam đất, ít khung, chia khối bằng đường kẻ, ảnh dạng vòm.", "Cá tính và 'có gu' nhất, khác hẳn đa số portfolio dev. Đọc thoải mái như một bài báo.", "Ít chất 'tech'; thay đổi nhiều nhất (font, ảnh, bỏ card). Cần cẩn thận để không trông như blog cá nhân."],
  d: ["D · Bento Vivid", "Lưới bento bo tròn lớn, nhiều màu (tím, vàng, đen), chữ đậm Plus Jakarta Sans, gradient ở tên vai trò.", "Bắt mắt nhất, hiện đại kiểu landing 2024–2026. Ảnh lớn, con số thành 'thẻ' riêng rất dễ nhớ.", "Nhiều màu dễ lấn nội dung; hợp với phần đầu trang, các phần dài phía dưới (Experience, Skills) cần tiết chế lại."]
};

const frame = document.getElementById("frame"), info = document.getElementById("info");
let cur = "a";
try { cur = localStorage.getItem("style-v") || "a"; } catch(e) {}
let depth = "2";
function applyDepth(){
  const s = frame.querySelector(".site"); if (!s) return;
  s.classList.remove("d1","d2","d3"); if (depth !== "0") s.classList.add("d"+depth);
  document.querySelectorAll("[data-d]").forEach(b=>b.setAttribute("aria-selected", b.dataset.d===depth));
}
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ depth=b.dataset.d; applyDepth(); });
function show(v){
  cur = v;
  frame.innerHTML = site(v);
  document.getElementById("depth").hidden = v !== "a";
  applyDepth();
  const i = INFO[v];
  info.innerHTML = `<div><h2>${i[0]}</h2><p>${i[1]}</p></div><div><b>Vì sao hợp</b><p>${i[2]}</p></div><div><b>Đánh đổi</b><p>${i[3]}</p></div><div><b>Ghi chú</b><p>${v==="now"?"Để so sánh.":"Chỉ đổi style; nội dung và thứ tự phần giữ nguyên như DESIGN.md."}</p></div>`;
  if (v==="now") info.innerHTML = `<div><h2>${i[0]}</h2><p>${i[1]}</p></div><div><b>Điểm được</b><p>${i[2]}</p></div><div><b>Vì sao chưa hấp dẫn</b><p>${i[3]}</p></div><div><b>Ghi chú</b><p>Mô phỏng lại từ globals.css để so sánh.</p></div>`;
  document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-selected", b.dataset.v===v));
  try { localStorage.setItem("style-v", v); } catch(e) {}
}
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>show(b.dataset.v));
document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{
  frame.classList.toggle("phone", b.dataset.size==="phone");
  document.querySelectorAll("[data-size]").forEach(x=>x.setAttribute("aria-selected", x===b));
});
const q = new URLSearchParams(location.search);
if (q.get("v")) cur = q.get("v");
if (q.get("d")) depth = q.get("d");
if (q.get("size")==="phone") document.querySelector('[data-size="phone"]').click();
show(cur);
</script>
</body>
</html>
